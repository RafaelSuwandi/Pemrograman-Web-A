<html>
<head>
    <title>Belajar Javascript Platform</title>
    <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
    <div class="kalkulator">
        <h1>Kalkulator Tambah/Kurang</h1>

        <div class="baris">
            <label for="bilangan1">Bilangan 1</label>
            <input type="text" id="bilangan1">
        </div>
        <div class="baris">
            <label for="bilangan2">Bilangan 2</label>
            <input type="text" id="bilangan2">
        </div>

        <div class="tombol">
            <button onclick="tambah()">Tambah</button>
            <button onclick="kurang()">Kurang</button>
        </div>

        <div class="baris">
            <label for="hasil">Hasil</label>
            <input type="text" id="hasil" readonly>
        </div>
    </div>

    <script type="text/javascript" src="kalkulator.js"></script>
</body>
</html>
