<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="Styles.css">

</head>
<body>
    
    <div id="calculator">
        <input id="display" readonly>
        <div id="keys">
            <button onclick="TampilkanNilai('+')" class="operator">+</button>
            <button onclick="TampilkanNilai('7')">7</button>
            <button onclick="TampilkanNilai('8')">8</button>
            <button onclick="TampilkanNilai('9')">9</button>
            <button onclick="TampilkanNilai('-')" class="operator">-</button>
            <button onclick="TampilkanNilai('4')">4</button>
            <button onclick="TampilkanNilai('5')">5</button>
            <button onclick="TampilkanNilai('6')">6</button>
            <button onclick="TampilkanNilai('*')" class="operator">*</button>
            <button onclick="TampilkanNilai('1')">1</button>
            <button onclick="TampilkanNilai('2')">2</button>
            <button onclick="TampilkanNilai('3')">3</button>
            <button onclick="TampilkanNilai('/')" class="operator">/</button>
            <button onclick="TampilkanNilai('0')">0</button>
            <button onclick="TampilkanNilai('.')">.</button>
            <button onclick="hitung()">=</button>
            <button onclick="clearDisplay()" class="operator">C</button>
        </div>
    </div>

    <script type="text/javascript" src="Index.js"></script>
</body>
</html>
