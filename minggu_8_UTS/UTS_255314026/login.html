<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        .sukses {color: green;}
        .gagal { color: red;}
    </style>
</head>
<body>
    <h1>Login Semintar IT Days</h1>
    <form id="form-login">
        <label for="username">Username</label>
        <input type="text" id="username">
        
        <label for="password">Password</label>
        <input type="text" id="password">

        <label><input type="checkbox" id="lihat"> Tampilkan Password</label>

        <button type="submit">Login</button>
    </form>

    <p id="pesan" ></p>

    <script>
        const form = document.getElementById('form-login'); // <= Bagian A pake iD form-login 
        const pesan = document.getElementById('pesan');

        form.addEventListener("submit", function (e){ // <= Bagian B isi dgn submit jgn click
            e.preventDefault(); // <= Bagian C pakai prevernt default untuk mencegah terjadi reload halaman
            const username = document.getElementById('username').value.trim(); // <= Bagian D ambil value dari username
            const password = document.getElementById('password').value

            if(username === "" || password === "") { // <= Bagian E mengecek apakah password dan username kosong
                pesan.textContent = 'Username dan password wajib diisi';
                pesan.className = 'gagal';
            } else if(username === "admin" && password === "12345"){ // <= mengecek jika username dan password sudah betul dengan yang diberikan ketentuan soal
                pesan.textContent = 'Login berhasil, selamat datang ' + username + '!'; // <= bagian G pakai .textcontent 
                pesan.className = 'berhasil'; // <= Bagian H, kebalikan dari gagal yang ada di atas begitu juga untuk bagian G sama seperti di atas di blok IF ()
            }
        });

        document.getElementById('lihat').addEventListener('change', function () {
            const kolom = document.getElementById('password');
            if(this.checked) { // <= Bagian i, mengecek kalauu kolom di samping password di centang maka lakukan perintah if di bawah
                kolom.type = 'text';
            } else { 
                kolom.type = 'password'; // < Bagian J, pakai id password, katika kolom tidak di centang maka akan berubah menjadi bintang
            }
        });
    </script>
</body>
</html>
